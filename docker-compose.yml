services:
  keyframe-extract:
    build: .
    ports:
      - "${KEYFRAME_PORT:-8088}:8000"
    environment:
      VIDEO_ROOT: /videos
      OUTPUT_DIR: /output
      CACHE_DIR: /cache
    volumes:
      - ${VIDEO_DIR:-./videos}:/videos:ro
      - ${PNG_OUTPUT_DIR:-./output}:/output
      - ${KEYFRAME_CACHE_DIR:-./.cache}:/cache
    restart: unless-stopped
